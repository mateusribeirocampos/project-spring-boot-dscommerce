name: Supabase Keep-Alive Ping

on:
  schedule:
    # Run each hour (00:00, 06:00, 12:00, 18:00 UTC)
    - cron: '0 */6 * * *'
  workflow_dispatch:  # allow run manually

jobs:
  ping-supabase:
    runs-on: ubuntu-latest

    steps:
      - name: Ping Supabase Database
        run: |
          echo "🔄 Starting ping to Supabase..."
          echo "Timestamp: $(date -u '+%Y-%m-%d %H:%M:%S UTC')"

          # Ping the Render API (your Spring Boot app)
          response=$(curl -s -w "\n%{http_code}" \
                "${{ secrets.SUPABASE_URL }}/products")

          # Split the response body and HTTP code
          http_code=$(echo "$response" | tail -n1)
          body=$(echo "$response" | head -n-1)

          echo "📊 HTTP Status: $http_code"

          # Check if the response was successful
          if [[ "$http_code" =~ ^2[0-9][0-9]$ ]]; then
            echo "✅ API is active and responding!"
            echo "Response preview: ${body:0:200}..."
          else
            echo "⚠️ Unexpected response (code $http_code)"
            echo "Response: $body"
            # The job doesn't fail, it just registers.
          fi

      - name: Verify API Health
        run: |
          echo "🔍 Verifying API health..."

          # Try to get product count
          response=$(curl -s -w "\n%{http_code}" \
                "${{ secrets.SUPABASE_URL }}/products?size=1")

          http_code=$(echo "$response" | tail -n1)
          body=$(echo "$response" | head -n-1)

          echo "📊 HTTP Status: $http_code"

          case $http_code in
            200)
              echo "✅ API endpoint accessible!"
              echo "Response preview: ${body:0:200}..."
              ;;
            404)
              echo "⚠️ Endpoint not found (check API path)"
              ;;
            500)
              echo "⚠️ Server error (database might be paused)"
              echo "Response: $body"
              ;;
            *)
              echo "⚠️ Response: $http_code"
              echo "Body: $body"
              ;;
          esac

      - name: Ping summarize
        run: |
          echo "📋 ================================"
          echo "✅ Ping conclude with successfully!"
          echo "🕐 Next ping in ~6 hours"
          echo "📅 Date: $(date -u '+%Y-%m-%d %H:%M:%S UTC')"
          echo "================================"
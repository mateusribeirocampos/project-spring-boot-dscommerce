name: Supabase Keep-Alive Ping
on:
  schedule:
    # Todos os dias da semana, às 4:43 e 22:43 UTC.
    - cron: '43 4,22 * * *'
  workflow_dispatch:

jobs:
  ping-supabase:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Consultar tb_product (atividade real de banco)
        env:
          URL: ${{ secrets.SUPABASE_URL }}
          ANON: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          if [ -z "$URL" ] || [ -z "$ANON" ]; then
            echo "::error::SUPABASE_URL ou SUPABASE_ANON_KEY ausente — o ping não teria como consultar o banco."
            exit 1
          fi

          # select=id&limit=1 é a consulta mais barata que ainda ATINGE a
          # tabela: o PostgREST traduz em SELECT no Postgres, que é o que o
          # Supabase contabiliza como atividade. Um health check do GoTrue
          # responde 200 sem encostar no banco — foi essa a armadilha.
          resposta=$(curl -s -m 30 -w "\n%{http_code}" \
                       -H "apikey: $ANON" \
                       -H "Authorization: Bearer $ANON" \
                       "$URL/rest/v1/tb_product?select=id&limit=1")

          codigo=$(printf '%s' "$resposta" | tail -n1)
          corpo=$(printf '%s' "$resposta" | sed '$d')

          echo "HTTP $codigo"
          echo "corpo: ${corpo:0:200}"

          if [ "$codigo" != "200" ]; then
            echo "::error::Consulta a tb_product falhou com HTTP $codigo. O banco NÃO foi tocado e o projeto segue rumo à pausa."
            exit 1
          fi

          echo "✅ tb_product consultada — atividade registrada no banco."

# ==============================================================================
# DSCOMMERCE - Production Profile
# ==============================================================================

spring:
  # DataSource
  datasource:
    driver-class-name: org.postgresql.Driver
    # Using Transaction Pooler (port 6543) for IPv4 compatibility
    # See: https://supabase.com/docs/guides/database/connecting-to-postgres#connection-pooler
    # prepareThreshold=0 disables prepared statement caching (required for Transaction Pooler)
    url: jdbc:postgresql://${DB_HOST}:${DB_PORT:6543}/${DB_NAME}?sslmode=require&prepareThreshold=0&socketTimeout=30
    username: ${DB_USER}
    password: ${DB_PASSWORD}

    # Connection pool optimized for Supabase Transaction Pooler + Render Free Tier
    hikari:
      maximum-pool-size: 20
      minimum-idle: 5
      connection-timeout: 30000
      idle-timeout: 600000
      max-lifetime: 1800000
      leak-detection-threshold: 60000

  # JPA/Hibernate
  jpa:
    hibernate:
      ddl-auto: none
    show-sql: false
    properties:
      hibernate:
        format_sql: false
        generate_statistics: false

  # Flyway
  flyway:
    baseline-on-migrate: true
    baseline-version: 1

# Logging - Production (minimal logging for performance)
logging:
  level:

    root: WARN
    com.dscommerce: INFO
    org.springframework.web: WARN
    org.springframework.security: WARN
    org.hibernate.SQL: WARN
    com.zaxxer.hikari: WARN
    org.springframework.jdbc: WARN

# Server
server:
  port: ${PORT:8080}

  # Generic error messages for security
  error:
    include-message: never
    include-binding-errors: never
    include-stacktrace: never
    include-exception: false

springdoc:
  swagger-ui:
    enabled: false
  api-docs:
    enabled: false

# Security - OAuth2/JWT Configuration
security:
  client-id: ${CLIENT_ID}
  client-secret: ${CLIENT_SECRET}
  jwt:
    duration: ${JWT_DURATION:3600}

# CORS - Production origins only
cors:
  origins: ${CORS_ORIGINS}

# resend email
email:
  from-address: ${EMAIL_FROM_ADDRESS:onboarding@resend.dev}
  from-name: ${FROM_NAME:dscommerce}

app:
  email:
    resetPasswordUri: "${RESET_PASSWORD_URI:https://dscommerce-frontend.vercel.app/reset-password?token=}"

  security:
    jwt:
      keystore-base64: ${JWT_KEYSTORE_BASE64}
      keystore-password: ${JWT_KEYSTORE_PASSWORD}
      key-alias: ${JWT_KEY_ALIAS:dscommerce-jwt}
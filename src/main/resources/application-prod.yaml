# ==============================================================================
# DSCOMMERCE - Production Profile
# ==============================================================================

spring:
  datasource:
    driver-class-name: org.postgresql.Driver
    url: jdbc:postgresql://${DB_HOST}:${DB_PORT:5432}/${DB_NAME}
    username: ${DB_USER}
    password: ${DB_PASSWORD}

    # Connection pool optimized for Supabase Transaction Pooler + Render Free Tier
    hikari:
      maximum-pool-size: 3          # Transaction Pooler: fewer connections
      minimum-idle: 1
      connection-timeout: 20000      # 20 seconds
      idle-timeout: 180000           # 3 minutes (shorter for pooler)
      max-lifetime: 300000           # 5 minutes (shorter for pooler)
      leak-detection-threshold: 60000

      # CRITICAL: Disable prepared statement caching for Transaction Pooler
      data-source-properties:
        cachePrepStmts: false
        prepStmtCacheSize: 0
        prepStmtCacheSqlLimit: 0

  # JPA/Hibernate
  jpa:
    database-platform: org.hibernate.dialect.PostgreSQLDialect

    hibernate:
      # IMPORTANT: First deploy needs 'create' or 'update'
      # After first deploy, change to 'validate' or 'none'
      ddl-auto: ${HIBERNATE_DDL_AUTO:update}

    show-sql: false

    properties:
      hibernate:
        # IMPORTANT: Disable query caching for Transaction Pooler
        jdbc:
          batch_size: 10            # Reduced for Transaction Pooler
          fetch_size: 20            # Reduced for Transaction Pooler

        # Disable statement caching
        query:
          plan_cache_max_size: 0
          plan_parameter_metadata_max_size: 0

        # Connection handling for Transaction Pooler
        connection:
          provider_disables_autocommit: false

        generate_statistics: false

# Logging
logging:
  file:
    name: ${LOG_FILE_PATH:/var/log/dscommerce/application.log}
    max-size: 10MB
    max-history: 30

  level:
    root: WARN
    com.dscommerce: INFO
    org.springframework.web: WARN
    org.springframework.security: WARN
    org.hibernate.SQL: WARN
    # Adjust via env for troubleshooting: ${LOG_LEVEL_APP:INFO}

# Server
server:
  port: ${PORT:8080}

  # Generic error messages for security
  error:
    include-message: never
    include-binding-errors: never
    include-stacktrace: never
    include-exception: false

  # Response compression for better performance
  compression:
    enabled: true
    mime-types: text/html,text/xml,text/plain,text/css,text/javascript,application/javascript,application/json
    min-response-size: 1024

# Security
security:
  client-id: ${CLIENT_ID}
  client-secret: ${CLIENT_SECRET}
  jwt:
    duration: ${JWT_DURATION:3600}

# CORS - Production origins only
cors:
  # Example: https://app.dscommerce.com,https://admin.dscommerce.com
  origins: ${CORS_ORIGINS}


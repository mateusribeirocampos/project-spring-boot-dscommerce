# ==============================================================================
# DSCOMMERCE - Production Profile
# ==============================================================================

spring:
  # DataSource
  datasource:
    driver-class-name: org.postgresql.Driver
    # Using Transaction Pooler (port 6543) for IPv4 compatibility
    # See: https://supabase.com/docs/guides/database/connecting-to-postgres#connection-pooler
    url: jdbc:postgresql://${DB_HOST}:${DB_PORT:6543}/${DB_NAME}?sslmode=require
    username: ${DB_USER}
    password: ${DB_PASSWORD}

    # Connection pool optimized for Supabase Transaction Pooler + Render Free Tier
    hikari:
      maximum-pool-size: 20
      minimum-idle: 5
      connection-timeout: 30000
      idle-timeout: 600000
      max-lifetime: 1800000
      leak-detection-threshold: 60000

  # JPA/Hibernate
  jpa:
    database-platform: org.hibernate.dialect.PostgreSQLDialect

    hibernate:
      ddl-auto: ${HIBERNATE_DDL_AUTO:validate}
      # Options: create, create-drop, update, validate, none
      # Use 'update' for first deploy, then 'validate' for subsequent deploys

    show-sql: false

    properties:
      hibernate:
        format_sql: false
        generate_statistics: false

# Logging - Production (minimal logging for performance)
logging:
  level:
    root: WARN
    com.dscommerce: INFO
    org.springframework.web: WARN
    org.springframework.security: WARN
    org.hibernate.SQL: WARN
    com.zaxxer.hikari: WARN
    org.springframework.jdbc: WARN

# Server
server:
  port: ${PORT:8080}

  # Generic error messages for security
  error:
    include-message: never
    include-binding-errors: never
    include-stacktrace: never
    include-exception: false

# Security - OAuth2/JWT Configuration
security:
  client-id: ${CLIENT_ID}
  client-secret: ${CLIENT_SECRET}
  jwt:
    duration: ${JWT_DURATION:3600}

# CORS - Production origins only
cors:
  origins: ${CORS_ORIGINS}
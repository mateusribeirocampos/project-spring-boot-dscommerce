# ==============================================================================
# DSCOMMERCE - Base Configuration (Common to All Profiles)
# ==============================================================================

spring:
  application:
    name: dscommerce

  # Active profile
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:test}

  # JPA/Hibernate
  jpa:
    properties:
      hibernate:
        format_sql: false

    # WARNING: Consider disabling in production if using async patterns
    open-in-view: false

# Security - OAuth2 and JWT
security:
  client-id: ${CLIENT_ID:myclientid}
  client-secret: ${CLIENT_SECRET:myclientsecret}
  jwt:
    duration: ${JWT_DURATION:86400}

cors:
  origins: ${CORS_ORIGINS:http://localhost:3000,http://localhost:5173}

logging:
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} - %msg%n"
    file: "%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n"

  level:
    root: INFO
    com.dscommerce: INFO
    org.springframework.web: INFO
    org.springframework.security: INFO
    org.hibernate.SQL: DEBUG
    org.hibernate.orm.jdbc.bind: TRACE

# Server
server:
  port: ${SERVER_PORT:8080}

  # Error handling
  error:
    include-message: always
    include-binding-errors: always
    include-stacktrace: on_param
    include-exception: false

mock:
  client-email: ${MOCK_CLIENT_EMAIL:maria@gmail.com}
  client-password: ${MOCK_CLIENT_PASSWORD:123456}

app:
  security:
    jwt:
      keystore-base64: ${JWT_KEYSTORE_BASE64:}
      keystore-password: ${JWT_KEYSTORE_PASSWORD:}
      key-alias: ${JWT_KEY_ALIAS:dscommerce-jwt}
# ==============================================================================
# DSCOMMERCE - Test Profile
# ==============================================================================

spring:
  # DataSource
  datasource:
    driver-class-name: org.h2.Driver
    url: jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    username: sa
    password:

    # Minimal connection pool for tests
    hikari:
      maximum-pool-size: 5
      minimum-idle: 1

  # H2 Console - Enabled for ResourceServerConfig compatibility
  h2:
    console:
      enabled: true
      path: /h2-console

  # JPA/Hibernate
  jpa:
    database-platform: org.hibernate.dialect.H2Dialect

    hibernate:
      ddl-auto: create-drop

    show-sql: false

    properties:
      hibernate:
        format_sql: true
        generate_statistics: false

  # Test data initialization (uncomment if needed)
  # sql:
  #   init:
  #     mode: always
  #     data-locations: classpath:test-data.sql

# Logging
logging:
  level:
    root: WARN
    com.dscommerce: INFO
    org.springframework.web: WARN
    org.springframework.security: WARN
    org.hibernate.SQL: WARN

# Server
server:
  port: 8080

# Security - Test values
security:
  client-id: myclientid
  client-secret: myclientsecret
  jwt:
    duration: 3600

# CORS - Permissive for tests
cors:
  origins: "*"
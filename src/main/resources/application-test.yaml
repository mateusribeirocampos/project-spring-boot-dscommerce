# ==============================================================================
# DSCOMMERCE - Test Profile
# ==============================================================================

spring:
  # DataSource
  datasource:
    driver-class-name: org.h2.Driver
    url: jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    username: sa
    password:

    # Minimal connection pool for tests
    hikari:
      maximum-pool-size: 5
      minimum-idle: 1

  # H2 Console - Enabled for ResourceServerConfig compatibility
  h2:
    console:
      enabled: true
      path: /h2-console

  # JPA/Hibernate
  jpa:
    hibernate:
      ddl-auto: create-drop

    show-sql: false

    properties:
      hibernate:
        format_sql: true
        generate_statistics: false

    # flyway
  flyway:
    enabled: false

  # Test data initialization (uncomment if needed)
  # sql:
  #   init:
  #     mode: always
  #     data-locations: classpath:test-data.sql

# Logging
logging:
  level:
    root: WARN
    com.dscommerce: INFO
    org.springframework.web: WARN
    org.springframework.security: WARN
    org.hibernate.SQL: WARN

# Server
server:
  port: 8080

# Security - Test values
security:
  client-id: myclientid
  client-secret: myclientsecret
  jwt:
    duration-access: ${ACCESS_DURATION:900} # 15m
    duration-refresh: ${REFRESH_DURATION:2592000} # 30d

# CORS - Permissive for tests
cors:
  origins: "*"

# resend email
email:
  from-address: ${EMAIL_FROM_ADDRESS:onboarding@resend.dev}
  from-name: ${FROM_NAME:dscommerce}

app:
  email:
    resetPasswordUri: "http://localhost:3000/reset-password?token="

  security:
    jwt:
      keystore-location: classpath:certs/dscommerce-jwt.p12
      keystore-password: ${JWT_KEYSTORE_PASSWORD:b8ZYDPrvMapad5YmSAp7/oP7eRLGersv}
      key-alias: ${JWT_KEY_ALIAS:dscommerce-jwt}

mock:
  client-email: ${MOCK_CLIENT_EMAIL:maria@gmail.com}
  client-password: ${MOCK_CLIENT_PASSWORD:123456}
# ==============================================================================
# DSCOMMERCE - Development Profile
# ==============================================================================

spring:
  # DataSource
  datasource:
    driver-class-name: org.postgresql.Driver
    url: jdbc:postgresql://localhost:${DB_PORT:5432}/${TEST_DB_NAME:dscommerce}
    username: ${TEST_DB_USER:mateusribeirodecampos}
    password: ${TEST_DB_PSWDB:}

    # Connection pool optimized for development
    hikari:
      maximum-pool-size: 10
      minimum-idle: 5
      connection-timeout: 30000
      idle-timeout: 600000
      max-lifetime: 1800000

  # JPA/Hibernate
  jpa:
    database-platform: org.hibernate.dialect.PostgreSQLDialect

    hibernate:
      ddl-auto: create-drop
      # Options: create, create-drop, update, validate, none

    show-sql: true

    properties:
      hibernate:
        generate_statistics: false

        # Generate DDL script file
        jakarta:
          persistence:
            schema-generation:
              create-source: metadata
              scripts:
                action: create
                create-target: create-schema.sql

        hbm2ddl:
          delimiter: ;

  # DevTools
  devtools:
    restart:
      enabled: true
    livereload:
      enabled: true

# Logging
logging:
  level:
    root: INFO
    com.dscommerce: DEBUG
    org.springframework.web: DEBUG
    org.springframework.security: DEBUG
    org.hibernate.SQL: DEBUG
    org.hibernate.orm.jdbc.bind: TRACE

# Server
server:
  port: 8080

  # Detailed error messages in development
  error:
    include-stacktrace: always

# Security
security:
  client-id: myclientid
  client-secret: myclientsecret
  jwt:
    duration: 3600

# CORS - Development origins
cors:
  origins: ${CORS_ORIGINS:http://localhost:3000,http://localhost:5173}